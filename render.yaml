services:
  - type: web
    name: aseel-store
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: HOST
        value: 0.0.0.0
      - key: RELOAD
        value: "0"
    autoDeploy: true
